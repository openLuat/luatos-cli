[package]
name = "luatos-flash"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LuatOS flash protocols — BK7258, EC618, etc."

[dependencies]
luatos-codec = { path = "../luatos-codec" }
luatos-soc = { path = "../luatos-soc" }
luatos-luadb = { path = "../luatos-luadb" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serialport.workspace = true
nusb.workspace = true
log.workspace = true
zip.workspace = true
walkdir.workspace = true
md-5.workspace = true
sha2.workspace = true
crc32fast = "1"
sevenz-rust2.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
io-kit-sys = "0.4"
core-foundation = "0.10"
